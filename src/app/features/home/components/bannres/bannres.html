@if (isHomeBanner()) {

  @if (homeSlides().length > 0) {

    <section
      class="banner-section banner-section--home"
      aria-label="Featured campaign"
      appAutoSlide="forward"
      [autoSlideInterval]="4000"
      appScrollReveal>

      <div class="banner-shell banner-shell--home">

        <div class="banner-slider">

          @for (slide of homeSlides(); track $index) {

            <a
              class="banner-frame banner-frame--home slider-item"
              [routerLink]="resolveRouterLink(slide.link)"
              [attr.aria-label]="'hero.bannerAlt' | translate"
            >

              <span
                class="banner-frame__edge"
                aria-hidden="true">
              </span>

              <img
                class="banner-image"
                [src]="resolveSlideImage(slide)"
                [alt]="'hero.bannerAlt' | translate"
                width="1800"
                height="600"
                decoding="async"
              />

              <span
                class="banner-frame__sheen"
                aria-hidden="true">
              </span>

            </a>

          }

        </div>

      </div>

    </section>

  }

} @else if (banners().length > 0) {

  <section
    class="banner-section"
    [ngClass]="stripClass()"
    aria-label="Promotional banners"
    appScrollReveal>

    <div class="banner-shell">

      <div class="banner-list">

        @for (banner of banners(); track banner.id) {

          <a
            class="banner-frame"
            [routerLink]="resolveRouterLink(resolveLink(banner))"
            [attr.aria-label]="'hero.bannerAlt' | translate"
          >

            <span
              class="banner-frame__edge"
              aria-hidden="true">
            </span>

            <img
              class="banner-image"
              [src]="resolveImage(banner)"
              [alt]="'hero.bannerAlt' | translate"
              width="1800"
              height="600"
              loading="lazy"
              decoding="async"
            />

            <span
              class="banner-frame__sheen"
              aria-hidden="true">
            </span>

          </a>

        }

      </div>

    </div>

  </section>

}
