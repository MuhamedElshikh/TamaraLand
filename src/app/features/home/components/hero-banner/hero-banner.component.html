<section class="hero-intro">

  <div class="hero-intro__overlay"></div>

  <div class="hero-intro__content">

    <img
      src="assets/logo.png"
      [alt]="'sidebar.logoAlt' | translate"
      class="hero-intro__logo">

    <p class="hero-intro__eyebrow">
{{ 'hero.eyebrow' | translate }}    </p>

    <h1 class="hero-intro__title">
{{ 'hero.title' | translate }}
    </h1>

    <p class="hero-intro__description">
      {{ 'hero.description' | translate }}
    </p>

    <div class="hero-intro__actions">

      <a
        routerLink="/new-in"
        class="btn btn-primary">

       {{ 'hero.shopNewIn' | translate }}

    </a>

      <a
        routerLink="/categories"
        class="btn btn-outline">

        {{ 'hero.exploreCollections' | translate }}

      </a>

    </div>

  </div>


</section>
