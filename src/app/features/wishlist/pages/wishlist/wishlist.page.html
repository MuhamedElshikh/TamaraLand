<section class="wishlist-page">
  <header class="wishlist-page__hero">
    <p class="section-kicker">Saved</p>
    <h1 class="section-title">Your wishlist</h1>
  </header>

  @if (isLoading()) {
    <div class="wishlist-page__loading">
      @for (i of [1, 2, 3]; track i) {
        <div class="wishlist-page__skeleton"></div>
      }
    </div>
  } @else if (items().length === 0) {
    <div class="wishlist-page__empty">
      <p class="section-copy">You haven't saved anything yet.</p>
      <a routerLink="/products" class="btn btn-primary">Discover products</a>
    </div>
  } @else {
    <div class="wishlist-page__list">
      @for (item of items(); track item.id) {
        <app-wishlist-item [item]="item" (removed)="onItemRemoved()" />
      }
    </div>
  }
</section>
