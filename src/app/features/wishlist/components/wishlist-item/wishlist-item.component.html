<article class="wishlist-item" [class.wishlist-item--busy]="isRemoving()">
  <a [routerLink]="['/products', item.id]" class="wishlist-item__image">
    <img [src]="item.imageUrl || fallbackImage" [alt]="item.name" />
  </a>

  <div class="wishlist-item__info">
    <a [routerLink]="['/products', item.id]" class="wishlist-item__name">{{ item.name }}</a>

    <p class="wishlist-item__rating">
      {{ (item.rating ?? 0).toFixed(1) }} ★ · {{ item.reviewsCount ?? 0 }} review{{ item.reviewsCount === 1 ? '' : 's' }}
    </p>

    <div class="wishlist-item__price-row">
      <p class="wishlist-item__price">{{ item.price | number }} EGP</p>
      @if (item.hasDiscount) {
        <p class="wishlist-item__price-old">{{ item.originalPrice | number }} EGP</p>
      }
    </div>

    @if (!item.inStock) {
      <p class="wishlist-item__out-of-stock">Out of stock</p>
    }
  </div>

  <div class="wishlist-item__actions">
    <a [routerLink]="['/products', item.id]" class="btn btn-primary wishlist-item__view-btn">View product</a>
    <button type="button" class="wishlist-item__remove" (click)="remove()" [disabled]="isRemoving()">
      {{ isRemoving() ? 'Removing…' : 'Remove' }}
    </button>
  </div>
</article>
