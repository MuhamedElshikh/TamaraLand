<form class="address-form" [formGroup]="form" (ngSubmit)="submit()">
  <h3 class="address-form__title">{{ existingAddress
    ? ('addressForm.editTitle' | translate)
    : ('addressForm.addTitle' | translate)
}}</h3>

  @if (errorMessage()) {
    <p class="address-form__error">{{ errorMessage() }}</p>
  }

  <div class="field-grid">
    <label class="field">
      <span><span>{{ 'addressForm.fullName' | translate }}</span></span>
      <input type="text" formControlName="fullName" placeholder="{{ 'addressForm.placeholder.fullName' | translate }}" />
      @if (controlHasError('fullName', 'required')) {
        <small>{{ 'addressForm.validation.fullNameRequired' | translate }}</small>
      }
    </label>

    <label class="field">
      <span>{{ 'addressForm.phoneNumber' | translate }}</span>
      <input type="tel" formControlName="phoneNumber" placeholder="{{ 'addressForm.placeholder.phone' | translate }}" />
      @if (controlHasError('phoneNumber', 'required')) {
        <small>{{ 'addressForm.validation.phoneRequired' | translate }}</small>
      } @else if (controlHasError('phoneNumber', 'pattern')) {
        <small>{{ 'addressForm.validation.phoneInvalid' | translate }}</small>
      }
    </label>
  </div>

  <div class="field-grid">
    <label class="field">
      <span>{{ 'addressForm.governorate' | translate }}</span>
      <select formControlName="governorate">
        <option value="" disabled>{{ 'addressForm.selectGovernorate' | translate }} </option>
        @for (gov of governorates(); track gov) {
          <option [value]="gov">{{ gov }}</option>
        }
      </select>
      @if (controlHasError('governorate', 'required')) {
        <small>{{ 'addressForm.validation.governorateRequired' | translate }}</small>
      }
    </label>

    <label class="field">
      <span>{{ 'addressForm.area' | translate }}</span>
      <select formControlName="area" [disabled]="!form.get('governorate')?.value">
        <option value="" disabled>{{ 'addressForm.selectArea' | translate }}</option>
        @for (area of areasForSelectedGovernorate(); track area.id) {
          <option [value]="area.name">{{ area.name }} (+{{ area.shippingCost | number }} EGP shipping)</option>
        }
      </select>
      @if (controlHasError('area', 'required')) {
        <small>{{ 'addressForm.validation.areaRequired' | translate }}</small>
      }
    </label>
  </div>

  <label class="field">
    <span>{{ 'addressForm.street' | translate }}</span>
    <input type="text" formControlName="street" placeholder="{{ 'addressForm.placeholder.street' | translate }}" />
    @if (controlHasError('street', 'required')) {
      <small>{{ 'addressForm.validation.streetRequired' | translate }}</small>
    }
  </label>

  <div class="field-grid field-grid--three">
    <label class="field">
      <span>{{ 'addressForm.building' | translate }}</span>
      <input type="text" formControlName="building" placeholder="{{ 'addressForm.placeholder.building' | translate }}" />
    </label>
    <label class="field">
      <span>{{ 'addressForm.floor' | translate }}</span>
      <input type="text" formControlName="floor" placeholder="{{ 'addressForm.placeholder.floor' | translate }}" />
    </label>
    <label class="field">
      <span>{{ 'addressForm.apartment' | translate }}</span>
      <input type="text" formControlName="apartment" placeholder="{{ 'addressForm.placeholder.apartment' | translate }}" />
    </label>
  </div>

  <label class="field">
    <span>{{ 'addressForm.notes' | translate }}</span>
    <textarea formControlName="notes" rows="2" placeholder="{{ 'addressForm.placeholder.notes' | translate }}"></textarea>
  </label>

  <label class="address-form__checkbox">
    <input type="checkbox" formControlName="isDefault" />
    <span>{{ 'addressForm.setDefault' | translate }}</span>
  </label>

  <div class="address-form__actions">
    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
{{ isSubmitting()
    ? ('addressForm.saving' | translate)
    : (
        existingAddress
          ? ('addressForm.saveChanges' | translate)
          : ('addressForm.addAddress' | translate)
      )
}}    </button>
    <button type="button" class="btn btn-outline" (click)="cancel()">{{ 'addressForm.cancel' | translate }}</button>
  </div>
</form>
