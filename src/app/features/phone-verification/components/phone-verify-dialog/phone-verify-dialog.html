<div class="verify-dialog-backdrop" (click)="close()">

  <div class="verify-dialog" (click)="$event.stopPropagation()">

    <div class="verify-dialog__header">

      <h3>{{ 'verifyPhone.title' | translate }}</h3>

      <button
        type="button"
        class="verify-dialog__close"
        (click)="close()"
        [attr.aria-label]="'verifyPhone.close' | translate">

        ×

      </button>

    </div>

    <p class="verify-dialog__phone">

      {{ 'verifyPhone.message' | translate }}

      <strong>{{ phoneNumber }}</strong>

    </p>

    @if (errorMessage()) {
      <p class="verify-dialog__error">
        {{ errorMessage() }}
      </p>
    }

    @if (!codeSent()) {

      <div class="verify-dialog__loading">

        <span class="verify-dialog__spinner"></span>

        <span>
          {{ 'verifyPhone.sendingCode' | translate }}
        </span>

      </div>

    } @else {

      <label class="verify-dialog__field">

        <span>
          {{ 'verifyPhone.enterCode' | translate }}
        </span>

        <input
          type="text"
          inputmode="numeric"
          maxlength="6"
          [placeholder]="'verifyPhone.codePlaceholder' | translate"
          class="verify-dialog__otp-input"
          [value]="code()"
          (input)="onCodeInput($any($event.target).value)" />

      </label>

      <button
        type="button"
        class="btn btn-primary verify-dialog__submit"
        [disabled]="code().length !== 6 || isVerifying()"
        (click)="verify()">

        {{
          isVerifying()
            ? ('verifyPhone.verifying' | translate)
            : ('verifyPhone.verify' | translate)
        }}

      </button>

      <button
        type="button"
        class="verify-dialog__resend"
        [disabled]="resendCountdown() > 0 || isSendingCode()"
        (click)="sendCode()">

        @if (resendCountdown() > 0) {

          {{
            'verifyPhone.resendIn'
              | translate:{ seconds: resendCountdown() }
          }}

        } @else if (isSendingCode()) {

          {{ 'verifyPhone.sending' | translate }}

        } @else {

          {{ 'verifyPhone.resend' | translate }}

        }

      </button>

    }

  </div>

</div>
