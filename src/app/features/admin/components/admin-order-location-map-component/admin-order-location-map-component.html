<div class="admin-location-map">

  <div class="admin-location-map__header">

    <div class="admin-location-map__address">
      <span class="admin-location-map__label">
        Customer Location
      </span>

      <span class="admin-location-map__value">
        {{ governorate }}
        {{ area ? ' - ' + area : '' }}
        {{ street ? ' - ' + street : '' }}
        {{ building ? ', Bldg ' + building : '' }}
        {{ floor ? ', Floor ' + floor : '' }}
        {{ apartment ? ', Apt ' + apartment : '' }}
      </span>
    </div>

    <button
      type="button"
      class="admin-location-map__share"
      [disabled]="isSharing"
      (click)="shareLocation()"
    >
      @if (isSharing) {
        <span class="share-spinner"></span>
        Sharing...
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>

        Share Location
      }
    </button>

  </div>

  <div
    id="admin-order-location-map"
    class="admin-location-map__map"
  ></div>

  @if (shareMessage) {
    <div class="admin-location-map__share-message">
      {{ shareMessage }}
    </div>
  }

</div>
