<div>

  <h1 class="admin-page__title">
    {{ 'banners.management.title' | translate }}
  </h1>

  <p class="admin-page__subtitle">
    {{ 'banners.management.subtitle' | translate }}
  </p>

</div>


<!-- ========================================================= -->
<!-- Add Banner -->
<!-- ========================================================= -->

<a
  routerLink="/admin/banner-form"
  class="btn btn-primary"
>

  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    aria-hidden="true"
  >

    <line
      x1="12"
      y1="5"
      x2="12"
      y2="19"
    />

    <line
      x1="5"
      y1="12"
      x2="19"
      y2="12"
    />

  </svg>

  {{ 'banners.management.addBanner' | translate }}

</a>



<!-- ========================================================= -->
<!-- Delete Error -->
<!-- ========================================================= -->

@if (deleteError()) {

  <div class="alert alert-danger">

    {{ deleteError() }}

  </div>

}



<!-- ========================================================= -->
<!-- Filters -->
<!-- ========================================================= -->

<div class="filters-grid">


  <!-- ========================= -->
  <!-- Banner Type -->
  <!-- ========================= -->

  <div class="filter-group">

    <label class="form-label">

      {{ 'banners.filters.bannerType' | translate }}

    </label>


    <select
      class="form-control form-select"
      [ngModel]="type() ?? ''"
      (ngModelChange)="onTypeChange($event)"
    >

      <option value="">

        {{ 'banners.filters.allTypes' | translate }}

      </option>


      <option [value]="1">

        {{ 'banners.types.heroSlider' | translate }}

      </option>


      <option [value]="2">

        {{ 'banners.types.homeBanner' | translate }}

      </option>


      <option [value]="3">

        {{ 'banners.types.offerBanner' | translate }}

      </option>


      <option [value]="4">

        {{ 'banners.types.categoryBanner' | translate }}

      </option>

    </select>

  </div>



  <!-- ========================= -->
  <!-- Status -->
  <!-- ========================= -->

  <div class="filter-group">

    <label class="form-label">

      {{ 'banners.filters.status' | translate }}

    </label>


    <select
      class="form-control form-select"
      [ngModel]="status() ?? ''"
      (ngModelChange)="onStatusChange($event)"
    >

      <option value="">

        {{ 'banners.filters.allStatus' | translate }}

      </option>


      <option value="true">

        {{ 'common.active' | translate }}

      </option>


      <option value="false">

        {{ 'common.inactive' | translate }}

      </option>

    </select>

  </div>

</div>



<!-- ========================================================= -->
<!-- Data Table -->
<!-- ========================================================= -->

<app-data-table
  [columns]="columns"
  [rows]="banners()"
  [isLoading]="isLoading()"
  emptyMessage="banners.management.noBanners"
>

  <ng-template
    #actions
    let-row
  >

    <div class="action-buttons">


      <!-- ========================= -->
      <!-- Edit -->
      <!-- ========================= -->

      <button
        type="button"
        class="btn-icon btn-icon--edit"
        [title]="'common.edit' | translate"
        [attr.aria-label]="'common.edit' | translate"
        (click)="editBanner(row)"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >

          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
          />

          <path
            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
          />

        </svg>

      </button>



      <!-- ========================= -->
      <!-- Delete -->
      <!-- ========================= -->

      <button
        type="button"
        class="btn-icon btn-icon--delete"

        [title]="'common.delete' | translate"

        [attr.aria-label]="'common.delete' | translate"

        [disabled]="isDeleting() === row.id"

        (click)="deleteBanner(row)"
      >

        @if (isDeleting() === row.id) {

          <span class="spinner-sm"></span>

        }

        @else {

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >

            <polyline
              points="3 6 5 6 21 6"
            />

            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            />

          </svg>

        }

      </button>

    </div>

  </ng-template>

</app-data-table>



<!-- ========================================================= -->
<!-- Pagination -->
<!-- ========================================================= -->

@if (!isLoading() && totalPages() > 1) {

  <div class="pagination-wrapper">

    <app-pagination
      [currentPage]="pageNumber()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)"
    />

  </div>

}
