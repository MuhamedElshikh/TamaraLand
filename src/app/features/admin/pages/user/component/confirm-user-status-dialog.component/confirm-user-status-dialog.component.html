<div
  class="dialog-overlay"
  [class.dialog-overlay--show]="open()"
  (click)="close.emit()">
</div>

<div
  class="dialog"
  [class.dialog--show]="open()">

  @if (user(); as u) {

    <h2>
      {{ u.isActive ? ('admin.users.deactivateUserTitle' | translate) : ('admin.users.activateUserTitle' | translate) }}
    </h2>

    <p>

      {{ 'admin.users.confirmAction' | translate }}

      <strong>
        {{ u.isActive ? ('admin.users.disable' | translate) : ('admin.users.activate' | translate) }}
      </strong>

      <strong>{{ u.fullName }}</strong>?

    </p>

    <div class="dialog__actions">

      <button
        class="btn btn-secondary"
        (click)="close.emit()">

        {{ 'admin.labels.cancel' | translate }}

      </button>

      <button
        class="btn"
        [class.btn-danger]="u.isActive"
        [class.btn-success]="!u.isActive"
        (click)="submit()">

        {{ u.isActive ? ('admin.users.disable' | translate) : ('admin.users.activate' | translate) }}

      </button>

    </div>

  }

</div>
