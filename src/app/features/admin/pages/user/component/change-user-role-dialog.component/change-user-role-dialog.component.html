<div
  class="dialog-overlay"
  [class.dialog-overlay--show]="open()"
  (click)="close.emit()">
</div>

<div
  class="dialog"
  [class.dialog--show]="open()">

  @if (user(); as u) {

    <h2>{{ 'admin.users.changeRoleTitle' | translate }}</h2>

    <p>
      {{ 'admin.users.selectRoleFor' | translate }}
      <strong>{{ u.fullName }}</strong>.
    </p>

    <label>
      {{ 'admin.users.roleLabel' | translate }}
      <select
        [ngModel]="role()"
        (ngModelChange)="role.set($event)">

        <option value="Admin">{{ 'admin.users.roles.admin' | translate }}</option>
        <option value="Customer">{{ 'admin.users.roles.customer' | translate }}</option>

      </select>

    </label>

    <div class="dialog__actions">

      <button
        class="btn btn-secondary"
        (click)="close.emit()">

        {{ 'admin.labels.cancel' | translate }}

      </button>

      <button
        class="btn btn-primary"
        (click)="submit()">

        {{ 'admin.labels.saveChanges' | translate }}

      </button>

    </div>

  }

</div>
