<section class="users-page">

  <header class="users-page__header">

    <div>
      <h1>{{ 'admin.users.title' | translate }}</h1>
      <p>{{ 'admin.users.subtitle' | translate }}</p>
    </div>

    <button
      type="button"
      class="users-page__refresh"
      (click)="refresh()">

      {{ 'common.refresh' | translate }}

    </button>

  </header>

  <div class="users-page__filters">

    <div class="users-page__search">

      <input
        type="text"
        placeholder="{{ 'admin.users.searchPlaceholder' | translate }}"
        [ngModel]="search()"
        (ngModelChange)="search.set($event); onSearch()">

    </div>

    <select
      [ngModel]="selectedRole()"
      (ngModelChange)="onRoleChanged($event)">

      <option value="">{{ 'admin.users.roles.all' | translate }}</option>
      <option value="Admin">{{ 'admin.users.roles.admin' | translate }}</option>
      <option value="Customer">{{ 'admin.users.roles.customer' | translate }}</option>

    </select>

    <select
      [ngModel]="selectedStatus()"
      (ngModelChange)="onStatusChanged($event)">

      <option value="">{{ 'admin.users.status.all' | translate }}</option>
      <option value="true">{{ 'common.active' | translate }}</option>
      <option value="false">{{ 'common.inactive' | translate }}</option>

    </select>

  </div>

  <app-data-table
    [columns]="columns"
    [rows]="users()"
    [isLoading]="loading()"
    emptyMessage="admin.users.empty">

    <ng-template #actions let-user>

      <div class="users-page__actions">

          <button
          type="button"
          class="users-page__action users-page__action--view"
          (click)="viewUser(user)"
          [title]="'admin.users.view' | translate">

          {{ 'admin.users.view' | translate }}

        </button>

          <button
          type="button"
          class="users-page__action users-page__action--edit"
          (click)="editRole(user)"
          [title]="'admin.users.changeRoleButton' | translate">

          {{ 'admin.users.changeRoleButton' | translate }}

        </button>

        <button
          type="button"
          class="users-page__action"

          [class.users-page__action--danger]="user.isActive"

          [class.users-page__action--success]="!user.isActive"

          (click)="toggleStatus(user)">

          {{ (user.isActive ? 'admin.users.disable' : 'admin.users.activate') | translate }}

        </button>

      </div>

    </ng-template>

  </app-data-table>

  @if (totalPages() > 1) {

    <app-pagination

      [currentPage]="currentPage()"

      [totalPages]="totalPages()"

      (pageChange)="changePage($event)">

    </app-pagination>

  }
</section>
<app-user-details-drawer
  [user]="selectedUser()"
  [open]="drawerOpen()"
  (close)="closeDrawer()"
  (changeRole)="editRole($event)"
  (toggleStatus)="toggleStatus($event)">
</app-user-details-drawer>
<app-change-user-role-dialog
  [open]="roleDialogOpen()"
  [user]="selectedUser()"
  (close)="roleDialogOpen.set(false)"
  (save)="saveRole($event)">
</app-change-user-role-dialog>
<app-confirm-user-status-dialog
  [open]="statusDialogOpen()"
  [user]="selectedUser()"
  (close)="statusDialogOpen.set(false)"
  (confirm)="confirmStatus($event)">
</app-confirm-user-status-dialog>
