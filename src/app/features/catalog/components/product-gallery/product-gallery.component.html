<section class="gallery-shell">

 

  @if (images.length > 0) {
    <div class="gallery-shell__main" (click)="openLightbox()">
      <img
        [src]="selectedImage()?.imageUrl || images[0].imageUrl"
        [alt]="title"
      >
      <span class="gallery-zoom-badge">🔍 {{ 'gallery.zoom' | translate }}</span>
    </div>

    <div class="gallery-shell__thumbs">
      @for(image of images;track image.id){
        <button
          class="gallery-thumb"
          [class.gallery-thumb--active]="selectedImage()?.id===image.id"
          (click)="selectImage(image)"
          type="button">
          <img
            [src]="image.imageUrl"
            [alt]="title">
        </button>
      }
    </div>
  }
  @else if(fallbackImage){
    <div class="gallery-shell__main" (click)="openLightbox()">
      <img
        [src]="fallbackImage"
        [alt]="title">
    </div>
  }

  @if (isLightboxOpen()) {
    <div class="gallery-lightbox" (click)="closeLightbox()">
      <div class="gallery-lightbox__dialog" (click)="$event.stopPropagation()">
        <button type="button" class="gallery-lightbox__close" (click)="closeLightbox()">✕</button>
        <img [src]="selectedImage()?.imageUrl || images[0]?.imageUrl || fallbackImage" [alt]="title" class="gallery-lightbox__img" />
      </div>
    </div>
  }
</section>
