<a [routerLink]="['/products', product.id]" class="product-card" [attr.aria-label]="product.name">
  <div class="img-container">
    <img [src]="imageUrl" [alt]="product.name" loading="lazy" />
    @if (discountPercent > 0) {
      <span class="product-card__badge">-{{ discountPercent }}%</span>
    }

    <button
      type="button"
      class="product-card__wishlist-btn"
      [class.product-card__wishlist-btn--active]="isInWishlist()"
      (click)="toggleWishlist($event)"
      [attr.aria-label]="isInWishlist() ? 'Remove from wishlist' : 'Add to wishlist'"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" [attr.fill]="isInWishlist() ? 'currentColor' : 'none'">
        <path d="M12 20s-7-4.35-9.5-8.5C.8 8 2.4 4.5 6 4.5c2 0 3.4 1.1 6 3.6 2.6-2.5 4-3.6 6-3.6 3.6 0 5.2 3.5 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>

    <button
      type="button"
      class="product-card__add-btn"
      [class.product-card__add-btn--added]="addState() === 'added'"
      [disabled]="isAdding()"
      (click)="addToCart($event)"
    >
      @if (isAdding()) {
        Adding…
      } @else if (addState() === 'added') {
        Added ✓
      } @else if (addState() === 'error') {
        Try again
      } @else {
        Add to cart
      }
    </button>
  </div>
  <div class="product-card__info">
    <p class="product-card__name">{{ product.name }}</p>
    <div class="product-card__price-row">
      <p class="product-card__price">{{ finalPrice | number }} EGP</p>
      @if (hasDiscount && originalPrice !== null) {
        <p class="product-card__price-old">{{ originalPrice | number }} EGP</p>
      }
    </div>
   <div class="product-card__footer">

    <div class="product-card__rating">
        ⭐ {{ ratingValue.toFixed(1) }}
    </div>

    <div class="product-card__analytics">

        <span>

            👁 {{ product.viewsCount }}

        </span>

        <span>

            💬 {{ reviewCount }}

        </span>

    </div>

</div>
  </div>
</a>
