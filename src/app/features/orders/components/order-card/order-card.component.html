<a [routerLink]="['/orders', order().id]" class="order-card">

  <div class="order-card__main">

    <p class="order-card__number">
      {{ 'orders.orderNumber' | translate }} #{{ order().orderNumber }}
    </p>

  </div>

  <p class="order-card__total">
    {{ order().total | number }} {{ 'orders.currency' | translate }}
  </p>

  <span class="order-card__arrow">›</span>

</a>
