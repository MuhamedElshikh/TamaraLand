<app-auth-form-shell>
  <section class="auth-copy">
    <div class="auth-copy__header">
      <p class="section-kicker">
        {{ 'register.kicker' | translate }}
      </p>

      <h1>
        {{ 'register.title' | translate }}
      </h1>
    </div>

    @if (errorMessage()) {
      <app-error-message
        [title]="'register.registrationFailed' | translate"
        [message]="errorMessage()!">
      </app-error-message>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">

      <div class="field-grid">

        <label class="field">
          <span>{{ 'register.fields.firstName' | translate }}</span>

          <input
            type="text"
            formControlName="firstName"
            [placeholder]="'register.placeholders.firstName' | translate"
            autocomplete="given-name" />

          @if (controlHasError('firstName','required')) {
            <small>{{ 'register.validation.firstNameRequired' | translate }}</small>
          } @else if (controlHasError('firstName','minlength')) {
            <small>{{ 'register.validation.firstNameMinLength' | translate }}</small>
          }

        </label>

        <label class="field">

          <span>{{ 'register.fields.lastName' | translate }}</span>

          <input
            type="text"
            formControlName="lastName"
            [placeholder]="'register.placeholders.lastName' | translate"
            autocomplete="family-name" />

          @if (controlHasError('lastName','required')) {
            <small>{{ 'register.validation.lastNameRequired' | translate }}</small>
          } @else if (controlHasError('lastName','minlength')) {
            <small>{{ 'register.validation.lastNameMinLength' | translate }}</small>
          }

        </label>

      </div>

      <label class="field">

        <span>{{ 'register.fields.email' | translate }}</span>

        <input
          type="email"
          formControlName="email"
          [placeholder]="'register.placeholders.email' | translate"
          autocomplete="email" />

        @if (controlHasError('email','required')) {
          <small>{{ 'register.validation.emailRequired' | translate }}</small>
        } @else if (controlHasError('email','email')) {
          <small>{{ 'register.validation.emailInvalid' | translate }}</small>
        }

      </label>

      <label class="field">

        <span>{{ 'register.fields.password' | translate }}</span>

        <div class="password-input">
          <input [type]="isPasswordVisible() ? 'text' : 'password'" formControlName="password"
            [placeholder]="'register.placeholders.password' | translate" autocomplete="new-password" />
          <button class="password-toggle" type="button" (click)="togglePasswordVisibility('password')"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="isPasswordVisible() ? 'm3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.8 10.8 0 0 1 12 4c5.5 0 9.5 5.1 9.5 8s-1.4 4.1-3.5 5.6M6.2 6.2C3.8 7.8 2.5 10.1 2.5 12c0 2.9 4 8 9.5 8 1.1 0 2.2-.2 3.2-.6M14.1 14.1A3 3 0 0 1 9.9 9.9' : 'M2.5 12S6.5 4 12 4s9.5 5.1 9.5 8-4 8-9.5 8-9.5-5.1-9.5-8Z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z'" /></svg>
          </button>
        </div>

        @if (controlHasError('password','required')) {
          <small>{{ 'register.validation.passwordRequired' | translate }}</small>
        } @else if (controlHasError('password','minlength')) {
          <small>{{ 'register.validation.passwordMinLength' | translate }}</small>
        }

      </label>

      <label class="field">

        <span>{{ 'register.fields.confirmPassword' | translate }}</span>

        <div class="password-input">
          <input [type]="isConfirmPasswordVisible() ? 'text' : 'password'" formControlName="confirmPassword"
            [placeholder]="'register.placeholders.confirmPassword' | translate" autocomplete="new-password" />
          <button class="password-toggle" type="button" (click)="togglePasswordVisibility('confirmPassword')"
            [attr.aria-label]="isConfirmPasswordVisible() ? 'Hide password' : 'Show password'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="isConfirmPasswordVisible() ? 'm3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.8 10.8 0 0 1 12 4c5.5 0 9.5 5.1 9.5 8s-1.4 4.1-3.5 5.6M6.2 6.2C3.8 7.8 2.5 10.1 2.5 12c0 2.9 4 8 9.5 8 1.1 0 2.2-.2 3.2-.6M14.1 14.1A3 3 0 0 1 9.9 9.9' : 'M2.5 12S6.5 4 12 4s9.5 5.1 9.5 8-4 8-9.5 8-9.5-5.1-9.5-8Z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z'" /></svg>
          </button>
        </div>

        @if (controlHasError('confirmPassword','required')) {
          <small>{{ 'register.validation.confirmPasswordRequired' | translate }}</small>
        } @else if (passwordMismatch()) {
          <small>{{ 'register.validation.passwordMismatch' | translate }}</small>
        }

      </label>

      <button
        class="auth-submit"
        type="submit"
        [disabled]="isSubmitting()">

        @if (isSubmitting()) {

          <span class="auth-submit__spinner"></span>

          <span>{{ 'register.buttons.creating' | translate }}</span>

        } @else {

          <span>{{ 'register.buttons.createAccount' | translate }}</span>

        }

      </button>

    </form>

    <footer class="auth-footer">

      <p>

        {{ 'register.footer.alreadyHaveAccount' | translate }}

        <a routerLink="/login">
          {{ 'register.footer.signIn' | translate }}
        </a>

      </p>

      <small>
        {{ 'register.footer.terms' | translate }}
      </small>

    </footer>

  </section>
</app-auth-form-shell>
