<app-auth-form-shell>
  <section class="auth-copy">
    <div class="auth-copy__header">
      <p class="section-kicker">Welcome back</p>
      <h1>Sign in to TmaraLand</h1>
    </div>

    @if (errorMessage()) {
      <app-error-message title="Login failed" [message]="errorMessage()!"></app-error-message>
    }

    <!-- Social Authentication Buttons -->
    <div class="social-auth">
      <button
        class="social-btn social-btn--google"
        type="button"
        [disabled]="isGoogleSubmitting() || isSubmitting() || isFacebookSubmitting()"
        (click)="signInWithGoogle()"
      >
        @if (isGoogleSubmitting()) {
          <span class="auth-submit__spinner"></span>
          <span>Connecting Google...</span>
        } @else {
          <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        }
      </button>

      <button
        class="social-btn social-btn--facebook"
        type="button"
        [disabled]="isFacebookSubmitting() || isSubmitting() || isGoogleSubmitting()"
        (click)="signInWithFacebook()"
      >
        @if (isFacebookSubmitting()) {
          <span class="auth-submit__spinner"></span>
          <span>Connecting Facebook...</span>
        } @else {
          <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          <span>Continue with Facebook</span>
        }
      </button>
    </div>

    <div class="auth-divider">
      <span>or sign in with email</span>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
        @if (controlHasError('email', 'required')) {
          <small>Email is required.</small>
        } @else if (controlHasError('email', 'email')) {
          <small>Please enter a valid email address.</small>
        }
      </label>

      <label class="field">
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          placeholder="Your password"
          autocomplete="current-password"
        />
        @if (controlHasError('password', 'required')) {
          <small>Password is required.</small>
        } @else if (controlHasError('password', 'minlength')) {
          <small>Password must be at least 8 characters.</small>
        }
      </label>

      <button class="auth-submit" type="submit" [disabled]="isSubmitting() || isGoogleSubmitting() || isFacebookSubmitting()">
        @if (isSubmitting()) {
          <span class="auth-submit__spinner"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign in</span>
        }
      </button>
    </form>

    <footer class="auth-footer">
      <a routerLink="/forgot-password">Forgot password?</a>
      <p>
        New here?
        <a routerLink="/register">Create an account</a>
      </p>
    </footer>
  </section>
</app-auth-form-shell>
