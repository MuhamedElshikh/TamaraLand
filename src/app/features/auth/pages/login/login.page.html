<app-auth-form-shell>
  <section class="auth-copy">
    <div class="auth-copy__header">
      <p class="section-kicker">
        {{ 'login.kicker' | translate }}
      </p>
      <h1>
        {{ 'login.title' | translate }}
      </h1>
    </div>

    @if (errorMessage()) {
    <app-error-message [title]="'login.loginFailed' | translate" [message]="errorMessage()!">
    </app-error-message>
    }

    <!-- Social Authentication Buttons -->
    <div class="social-auth">

      <button class="social-btn social-btn--google" type="button"
        [disabled]="!isGoogleReady() || isGoogleSubmitting() || isSubmitting() "
        (click)="signInWithGoogle()">
        @if (isGoogleSubmitting()) {
        <span class="auth-submit__spinner"></span>
        <span>{{ 'login.social.googleLoading' | translate }}</span>
        } @else {
        <svg class="social-icon" viewBox="0 0 18 18" width="20" height="20">
          <path fill="#4285F4"
            d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z" />
          <path fill="#34A853"
            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z" />
          <path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z" />
          <path fill="#EA4335"
            d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z" />
        </svg>
        <span>{{ 'login.social.google' | translate }}</span>
        }
      </button>
    </div>

    <div class="auth-divider">
      <span>{{ 'login.social.divider' | translate }}</span>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>{{ 'login.email' | translate }}</span>
        <input type="email" formControlName="email" placeholder="{{ 'login.emailPlaceholder' | translate }}"
          autocomplete="email" />
        @if (controlHasError('email', 'required')) {
        <small>{{ 'login.validation.emailRequired' | translate }}</small>
        } @else if (controlHasError('email', 'email')) {
        <small>{{ 'login.validation.emailInvalid' | translate }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'login.password' | translate }}</span>
        <div class="password-input">
          <input [type]="isPasswordVisible() ? 'text' : 'password'" formControlName="password"
            placeholder="{{ 'login.passwordPlaceholder' | translate }}" autocomplete="current-password" />
          <button class="password-toggle" type="button" (click)="togglePasswordVisibility()"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="isPasswordVisible()">
            @if (isPasswordVisible()) {
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.8 10.8 0 0 1 12 4c5.5 0 9.5 5.1 9.5 8s-1.4 4.1-3.5 5.6M6.2 6.2C3.8 7.8 2.5 10.1 2.5 12c0 2.9 4 8 9.5 8 1.1 0 2.2-.2 3.2-.6M14.1 14.1A3 3 0 0 1 9.9 9.9" /></svg>
            } @else {
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6.5 4 12 4s9.5 5.1 9.5 8-4 8-9.5 8-9.5-5.1-9.5-8Z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /></svg>
            }
          </button>
        </div>
        @if (controlHasError('password', 'required')) {
        <small>{{ 'login.validation.passwordRequired' | translate }}</small>
        } @else if (controlHasError('password', 'minlength')) {
        <small>{{ 'login.validation.passwordTooShort' | translate }}</small>
        }
      </label>

      <button class="auth-submit" type="submit"
        [disabled]="isSubmitting() || isGoogleSubmitting()">
        @if (isSubmitting()) {
        <span class="auth-submit__spinner"></span>
        <span>{{ 'login.buttons.loading' | translate }}</span>
        } @else {
        <span>{{ 'login.buttons.login' | translate }}</span>
        }
      </button>
    </form>

    <footer class="auth-footer">
      <a
        routerLink="/forgot-password"
        [queryParams]="returnUrl ? { returnUrl } : {}">
        {{ 'login.footer.forgotPassword' | translate }}
      </a>
      <p>
        {{ 'login.footer.newHere' | translate }}
        <a
          routerLink="/register"
          [queryParams]="returnUrl ? { returnUrl } : {}">
          {{ 'login.footer.createAccount' | translate }}
        </a>
      </p>
    </footer>
  </section>
</app-auth-form-shell>
