<app-auth-form-shell>
  <section class="auth-copy">
    <div class="auth-copy__header">
      <p class="section-kicker">
        {{ 'login.kicker' | translate }}
      </p>
      <h1>
        {{ 'login.title' | translate }}
      </h1>
    </div>

    @if (errorMessage()) {
      <app-error-message
        [title]="'login.loginFailed' | translate"
        [message]="errorMessage()!">
      </app-error-message>
    }

    <!-- Social Authentication Buttons -->
    <div class="social-auth">

      <button
        class="social-btn social-btn--google"
        type="button"
        [disabled]="!isGoogleReady() || isGoogleSubmitting() || isSubmitting() || isFacebookSubmitting()"
        (click)="signInWithGoogle()"
      >
        @if (isGoogleSubmitting()) {
          <span class="auth-submit__spinner"></span>
          <span>{{ 'login.social.googleLoading' | translate }}</span>
        } @else {
          <svg class="social-icon" viewBox="0 0 18 18" width="20" height="20">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          <span>{{ 'login.social.google' | translate }}</span>
        }
      </button>

      <button
        class="social-btn social-btn--facebook"
        type="button"
        [disabled]="isFacebookSubmitting() || isSubmitting() || isGoogleSubmitting()"
        (click)="signInWithFacebook()"
      >
        @if (isFacebookSubmitting()) {
          <span class="auth-submit__spinner"></span>
          <span>{{ 'login.social.facebookLoading' | translate }}</span>
        } @else {
          <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          <span>{{ 'login.social.facebook' | translate }}</span>
        }
      </button>
    </div>

    <div class="auth-divider">
      <span>{{ 'login.social.divider' | translate }}</span>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>{{ 'login.email' | translate }}</span>
        <input
          type="email"
          formControlName="email"
          placeholder="{{ 'login.emailPlaceholder' | translate }}"
          autocomplete="email"
        />
        @if (controlHasError('email', 'required')) {
          <small>{{ 'login.validation.emailRequired' | translate }}</small>
        } @else if (controlHasError('email', 'email')) {
          <small>{{ 'login.validation.emailInvalid' | translate }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'login.password' | translate }}</span>
        <input
          type="password"
          formControlName="password"
          placeholder="{{ 'login.passwordPlaceholder' | translate }}"
          autocomplete="current-password"
        />
        @if (controlHasError('password', 'required')) {
          <small>{{ 'login.validation.passwordRequired' | translate }}</small>
        } @else if (controlHasError('password', 'minlength')) {
          <small>{{ 'login.validation.passwordTooShort' | translate }}</small>
        }
      </label>

      <button class="auth-submit" type="submit" [disabled]="isSubmitting() || isGoogleSubmitting() || isFacebookSubmitting()">
        @if (isSubmitting()) {
          <span class="auth-submit__spinner"></span>
          <span>{{ 'login.buttons.loading' | translate }}</span>
        } @else {
          <span>{{ 'login.buttons.login' | translate }}</span>
        }
      </button>
    </form>

    <footer class="auth-footer">
      <a routerLink="/forgot-password">
        {{ 'login.footer.forgotPassword' | translate }}
      </a>
      <p>
        {{ 'login.footer.newHere' | translate }}
        <a routerLink="/register">
          {{ 'login.footer.createAccount' | translate }}
        </a>
      </p>
    </footer>
  </section>
</app-auth-form-shell>
