<app-auth-form-shell>
  <section class="auth-copy">
    <div class="auth-copy__header">
      <p class="section-kicker">Reset access</p>
      <h1>Choose a new password</h1>
      <p class="section-copy">
        Use the token from your email to securely update your password.
      </p>
    </div>

    @if (successMessage()) {
      <div class="auth-alert auth-alert--success">
        {{ successMessage() }}
      </div>
    }

    @if (errorMessage()) {
      <app-error-message title="Reset failed" [message]="errorMessage()!"></app-error-message>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
        @if (controlHasError('email', 'required')) {
          <small>Email is required.</small>
        } @else if (controlHasError('email', 'email')) {
          <small>Please enter a valid email address.</small>
        }
      </label>

      <label class="field">
        <span>Reset token</span>
        <input type="text" formControlName="token" placeholder="Paste reset token" />
        @if (controlHasError('token', 'required')) {
          <small>Reset token is required.</small>
        }
      </label>

      <label class="field">
        <span>New password</span>
        <input
          type="password"
          formControlName="newPassword"
          placeholder="Create a new password"
          autocomplete="new-password"
        />
        @if (controlHasError('newPassword', 'required')) {
          <small>New password is required.</small>
        } @else if (controlHasError('newPassword', 'minlength')) {
          <small>Password must be at least 8 characters.</small>
        }
      </label>

      <label class="field">
        <span>Confirm new password</span>
        <input
          type="password"
          formControlName="confirmNewPassword"
          placeholder="Repeat new password"
          autocomplete="new-password"
        />
        @if (controlHasError('confirmNewPassword', 'required')) {
          <small>Please confirm your new password.</small>
        } @else if (passwordMismatch()) {
          <small>Passwords do not match.</small>
        }
      </label>

      <button class="auth-submit" type="submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="auth-submit__spinner"></span>
          <span>Updating password...</span>
        } @else {
          <span>Reset password</span>
        }
      </button>
    </form>

    <footer class="auth-footer">
      <a routerLink="/login">Back to login</a>
      <a routerLink="/forgot-password">Request another link</a>
    </footer>
  </section>
</app-auth-form-shell>
