<app-auth-form-shell>
  <section class="auth-copy">
    <div class="auth-copy__header">
      <p class="section-kicker">Need help</p>
      <h1>Forgot your password?</h1>
      <p class="section-copy">
        Enter your email and we'll send a reset link if an account exists.
      </p>
    </div>

    @if (successMessage()) {
      <div class="auth-alert auth-alert--success">
        {{ successMessage() }}
      </div>
    }

    @if (errorMessage()) {
      <app-error-message title="Request failed" [message]="errorMessage()!"></app-error-message>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
        @if (controlHasError('required')) {
          <small>Email is required.</small>
        } @else if (controlHasError('email')) {
          <small>Please enter a valid email address.</small>
        }
      </label>

      <button class="auth-submit" type="submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="auth-submit__spinner"></span>
          <span>Sending link...</span>
        } @else {
          <span>Send reset link</span>
        }
      </button>
    </form>

    <footer class="auth-footer">
      <a routerLink="/login">Back to login</a>
      <a routerLink="/register">Create account</a>
    </footer>
  </section>
</app-auth-form-shell>
