<div class="coupon-form">
  @if (appliedCouponCode) {
    <div class="coupon-form__applied">
      <span>Coupon <strong>{{ appliedCouponCode }}</strong> applied</span>
      <button type="button" (click)="removeCoupon()" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Removing…' : 'Remove' }}
      </button>
    </div>
  } @else {
    <form class="coupon-form__row" (submit)="$event.preventDefault(); apply()">
      <input
        type="text"
        placeholder="Coupon code"
        [value]="code()"
        (input)="code.set($any($event.target).value)"
      />
      <button type="submit" class="btn btn-outline" [disabled]="isSubmitting() || !code().trim()">
        {{ isSubmitting() ? 'Applying…' : 'Apply' }}
      </button>
    </form>

    @if (errorMessage()) {
      <p class="coupon-form__error">{{ errorMessage() }}</p>
    }
  }
</div>
